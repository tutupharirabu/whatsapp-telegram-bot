<div id="dashboard-stats" 
     class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8"
     hx-get="/api/dashboard-stats"
     hx-trigger="update-dashboard from:body"
     hx-swap="outerHTML">
    <div class="panel panel-hover p-5">
        <p class="text-sm font-medium mb-1 text-dim">Total Peserta Import</p>
        <p class="text-3xl font-bold">{{ stats.total_players }}</p>
    </div>
    <div class="panel panel-hover p-5">
        <p class="text-sm font-medium mb-1 text-dim">WA Aktif</p>
        <p class="text-3xl font-bold text-wa">{{ stats.wa_registered }}</p>
        <p class="text-xs mt-1 text-dim">Terdaftar WA</p>
    </div>
    <div class="panel panel-hover p-5">
        <p class="text-sm font-medium mb-1 text-dim">TG Aktif / Join</p>
        <p class="text-3xl font-bold text-tg">{{ stats.tg_registered }} / {{ stats.tg_joined_count }}</p>
        <p class="text-xs mt-1 text-dim">Terdaftar TG / Masuk Grup</p>
    </div>
</div>
