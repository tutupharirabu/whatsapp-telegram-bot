<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>GCAF Auto Messenger — Mulai</title>
    <script src="/static/vendor/tailwindcss.js"></script>
    <script src="/static/vendor/htmx.js"></script>
    <link rel="stylesheet" href="/static/tokens.css?v=2">
</head>
<body class="min-h-screen flex items-center justify-center p-6" style="background: radial-gradient(60rem 30rem at 50% -10%, rgba(99,102,241,0.08), transparent), var(--bg);">
    <div class="w-full max-w-[560px]">
        <div class="flex items-center gap-3 mb-6 justify-center">
            <span class="brand-mark" aria-hidden="true">G</span>
            <div>
                <p class="brand-title">GCAF 2026</p>
                <p class="brand-sub">Auto Messenger</p>
            </div>
        </div>

        <div class="panel overflow-hidden">
            <div style="height: 3px; background: linear-gradient(90deg, var(--accent), var(--tg));" aria-hidden="true"></div>
            <div class="p-8 sm:p-10">
                <h1 class="text-2xl font-bold mb-1.5">Upload Data Peserta</h1>
                <p class="text-sm text-dim mb-8">
                    Upload laporan harian untuk mengisi database peserta GCAF 2026.
                </p>

                <form id="upload-form" hx-post="/upload" hx-target="#upload-result" hx-swap="innerHTML"
                      hx-disabled-elt="#upload-submit-btn"
                      enctype="multipart/form-data" class="flex flex-col gap-4">

                    <label for="csv-file" class="dropzone !py-8 flex-col text-center" id="upload-zone">
                        <input type="file" id="csv-file" name="file" accept=".csv" required>
                        <span class="dropzone-icon" aria-hidden="true">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
                            </svg>
                        </span>
                        <span class="dropzone-text items-center">
                            <span class="dropzone-label" id="dz-label">Pilih file CSV</span>
                            <span class="dropzone-hint" id="dz-hint">atau klik untuk memilih file</span>
                        </span>
                    </label>

                    <button type="submit" id="upload-submit-btn" class="btn btn-primary btn-block !py-3 !text-base">
                        <span class="inline-flex items-center gap-2" id="btn-label-idle">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
                            Upload Data
                        </span>
                        <span class="inline-flex items-center gap-2" id="btn-label-loading" hidden>
                            <span class="spinner" style="border-color: rgba(255,255,255,0.35); border-top-color: #fff;"></span>
                            Mengunggah&hellip;
                        </span>
                    </button>
                </form>

                <div id="upload-result" class="mt-4 flex items-center justify-center min-h-8"></div>

                <p class="text-center mt-8 pt-6 border-t border-[var(--border)] text-xs text-faint">
                    Setelah upload berhasil, lanjut ke halaman <strong class="text-dim">Peserta</strong> untuk verifikasi status &amp; kirim pesan.
                </p>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var input = document.getElementById('csv-file');
            var zone = document.getElementById('upload-zone');
            var labelEl = document.getElementById('dz-label');
            var hintEl = document.getElementById('dz-hint');
            var defaultLabel = labelEl.textContent;
            var defaultHint = hintEl.textContent;

            input.addEventListener('change', function () {
                var file = input.files && input.files[0];
                if (!file) {
                    labelEl.textContent = defaultLabel;
                    hintEl.textContent = defaultHint;
                    zone.classList.remove('has-file');
                    return;
                }
                labelEl.textContent = file.name;
                hintEl.textContent = (file.size / 1024).toFixed(1) + ' KB — siap diunggah';
                zone.classList.add('has-file');
            });
        })();
    </script>
</body>
</html>
