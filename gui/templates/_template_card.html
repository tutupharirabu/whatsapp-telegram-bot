{% set descriptions = {
    'formal': 'Undangan resmi join grup',
    'kasual': 'Undangan santai join grup',
    'remind-redeem': 'Pengingat redeem kode akses',
    'remind-gear': 'Pengingat badge GEAR',
    'remind-both': 'Pengingat redeem + GEAR',
} %}
<div class="panel panel-hover" id="card-{{ key }}">
    <div class="px-5 py-4 border-b border-[var(--border)] flex items-center justify-between">
        <div>
            <span class="tag text-iris">{{ key }}</span>
            <span class="text-sm ml-2 text-dim">{{ descriptions.get(key, '') }}</span>
        </div>
    </div>
    <form hx-post="/templates/save/{{ key }}"
          hx-target="#card-{{ key }}"
          hx-swap="outerHTML"
          hx-indicator="#save-spin-{{ key }}"
          class="px-5 py-4">
        <textarea name="content"
            class="field w-full text-sm font-sans leading-relaxed min-h-[120px] resize-y">{{ tpl }}</textarea>
        <div class="flex items-center gap-3 mt-3">
            <button type="submit" class="btn btn-primary btn-sm" hx-disabled-elt="this">Simpan</button>
            <span id="save-spin-{{ key }}" class="spinner"></span>
        </div>
    </form>
</div>
