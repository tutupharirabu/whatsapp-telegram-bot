<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>GCAF Auto Messenger — Masuk</title>
    <script src="/static/vendor/tailwindcss.js"></script>
    <script src="/static/vendor/htmx.js"></script>
    <link rel="stylesheet" href="/static/tokens.css">
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="panel p-8 w-full max-w-sm">
        <p class="eyebrow mb-1">Restricted</p>
        <h1 class="text-2xl font-bold mb-1">Masuk Dashboard</h1>
        <p class="text-sm text-dim mb-6">Masukkan token akses untuk melanjutkan.</p>
        <form method="post" action="/login" class="flex flex-col gap-4">
            <input type="password" name="token" class="field w-full" placeholder="Token akses"
                   autocomplete="current-password" required autofocus aria-label="Token akses">
            {% if error %}<p class="text-xs text-danger">{{ error }}</p>{% endif %}
            <button type="submit" class="btn btn-primary w-full">Masuk</button>
        </form>
    </div>
</body>
</html>
