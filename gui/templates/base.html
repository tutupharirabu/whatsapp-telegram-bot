<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>{% block title %}GCAF Auto Messenger{% endblock %}</title>
    <script src="/static/vendor/tailwindcss.js"></script>
    <script src="/static/vendor/htmx.js"></script>
    <link rel="stylesheet" href="/static/tokens.css?v=2">
</head>
<body class="app-shell">
    <a href="#main-content" class="skip-link">Langsung ke konten</a>

    <aside class="sidebar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">G</span>
            <div>
                <p class="brand-title">GCAF 2026</p>
                <p class="brand-sub">Auto Messenger</p>
            </div>
        </div>

        <nav class="nav" aria-label="Navigasi utama">
            <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}" aria-current="{% if request.url.path == '/' %}page{% else %}false{% endif %}">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/></svg>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="/players" class="nav-item {% if request.url.path == '/players' %}active{% endif %}" aria-current="{% if request.url.path == '/players' %}page{% else %}false{% endif %}">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>
                <span class="nav-label">Peserta</span>
            </a>
            <a href="/templates" class="nav-item {% if request.url.path == '/templates' %}active{% endif %}" aria-current="{% if request.url.path == '/templates' %}page{% else %}false{% endif %}">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                <span class="nav-label">Template Pesan</span>
            </a>
            <a href="/check" class="nav-item {% if request.url.path == '/check' %}active{% endif %}" aria-current="{% if request.url.path == '/check' %}page{% else %}false{% endif %}">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="nav-label">Cek Nomor</span>
            </a>
            <a href="/logs" class="nav-item {% if request.url.path == '/logs' %}active{% endif %}" aria-current="{% if request.url.path == '/logs' %}page{% else %}false{% endif %}">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span class="nav-label">Riwayat</span>
            </a>
        </nav>

    </aside>

    <main id="main-content" class="container-base {% block main_width %}max-w-6xl{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
