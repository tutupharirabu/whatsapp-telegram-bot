<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCAF Auto Messenger</title>
    <script src="/static/vendor/tailwindcss.js"></script>
    <script src="/static/vendor/htmx.js"></script>
    <style>
        :root {
            --bg-body: #0a0a0a;
            --panel: #111111;
            --panel-2: #1a1a1a;
            --fg-main: #f5f5f5;
            --fg-dim: #a3a3a3;
            --border: #262626;
            --iris: #5e6ad2;
            --wa-green: #25D366;
            --tg-blue: #0088cc;
            --warn: #eab308;
            --error: #ef4444;
        }
        body {
            background-color: var(--bg-body);
            color: var(--fg-main);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .container-base { margin: 0 auto; padding: 2rem; }
        .eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--iris); font-weight: 600; }
        .panel { background-color: var(--panel); border: 1px solid var(--border); border-radius: 0.5rem; }
        .field { background-color: var(--panel-2); border: 1px solid var(--border); color: var(--fg-main); padding: 0.5rem 0.75rem; border-radius: 0.375rem; font-size: 0.875rem; }
        .field:focus { outline: none; border-color: var(--iris); box-shadow: 0 0 0 1px var(--iris); }
        .btn { display: inline-flex; align-items: center; justify-content: center; font-weight: 500; font-size: 0.875rem; padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; transition: background-color 0.15s, border-color 0.15s; }
        .btn-primary { background-color: var(--iris); color: white; border: 1px solid transparent; }
        .btn-primary:hover { background-color: #4b55a8; }
        .btn-ghost { background-color: transparent; border: 1px solid var(--border); color: var(--fg-main); }
        .btn-ghost:hover { background-color: var(--panel-2); border-color: #404040; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.75rem; text-transform: uppercase; color: var(--fg-dim); font-weight: 600; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        tr:hover td { background-color: var(--panel-2); }
        
        /* Layout */
        .layout-grid { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .sidebar { background-color: var(--panel); border-right: 1px solid var(--border); padding: 2rem 1rem; }
        .nav-item { display: block; padding: 0.5rem 1rem; margin-bottom: 0.25rem; border-radius: 0.375rem; color: var(--fg-dim); font-size: 0.875rem; transition: all 0.15s; }
        .nav-item:hover, .nav-item.active { background-color: var(--panel-2); color: var(--fg-main); }
        .nav-item.active { font-weight: 500; }
    </style>
</head>
<body class="layout-grid">
    <aside class="sidebar">
        <div class="mb-8 px-4">
            <h1 class="text-xl font-bold tracking-tight">GCAF 2026</h1>
            <p class="text-xs mt-1" style="color: var(--fg-dim);">Auto Messenger</p>
        </div>
        <nav>
            <a href="/" class="nav-item {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/players" class="nav-item {% if request.url.path == '/players' %}active{% endif %}">Peserta</a>
            <a href="/check" class="nav-item {% if request.url.path == '/check' %}active{% endif %}">Cek Nomor</a>
            <a href="/templates" class="nav-item {% if request.url.path == '/templates' %}active{% endif %}">Templates</a>
            <a href="/logs" class="nav-item {% if request.url.path == '/logs' %}active{% endif %}">Riwayat</a>
        </nav>
    </aside>
    <main class="container-base {% block main_width %}max-w-4xl{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
