<div id="dashboard-upload" class="panel p-4 mb-6" style="border-style: dashed;">
    <form hx-post="/upload" hx-encoding="multipart/form-data"
          hx-target="#dashboard-upload" hx-swap="outerHTML"
          hx-indicator="#upload-spin-dashboard" hx-disabled-elt="this">
        <div class="flex items-center gap-3 relative">
            <svg class="w-5 h-5 flex-shrink-0 text-dim" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <span class="text-sm text-dim flex-1">Upload laporan harian terbaru (.csv) untuk memperbarui data peserta</span>
            <span id="upload-spin-dashboard" class="spinner" role="status" aria-label="Mengunggah"></span>
            <input type="file" name="file" accept=".csv" required
                   class="text-sm opacity-0 absolute inset-0 w-full h-full cursor-pointer"
                   onchange="this.form.requestSubmit()"
                   aria-label="Pilih file CSV">
        </div>
    </form>
</div>
