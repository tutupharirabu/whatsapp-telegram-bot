<div id="dashboard-upload" class="mb-6">
    <form hx-post="/upload" hx-encoding="multipart/form-data"
          hx-target="#dashboard-upload" hx-swap="outerHTML"
          hx-indicator="#upload-spin-dashboard" hx-disabled-elt="this">
        <label class="dropzone" id="dz-dashboard">
            <span class="dropzone-icon" aria-hidden="true">
                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
                </svg>
            </span>
            <span class="dropzone-text">
                <span class="dropzone-label" id="dz-dashboard-label">Upload laporan harian (.csv)</span>
                <span class="dropzone-hint" id="dz-dashboard-hint">Pilih file untuk memperbarui data peserta</span>
            </span>
            <span id="upload-spin-dashboard" class="spinner" role="status" aria-label="Mengunggah"></span>
            <input type="file" name="file" accept=".csv" required
                   aria-labelledby="dz-dashboard-label"
                   onchange="var l=document.getElementById('dz-dashboard-label'),h=document.getElementById('dz-dashboard-hint'),z=document.getElementById('dz-dashboard'),f=this.files[0];if(f){l.textContent=f.name;h.textContent=(f.size/1024).toFixed(1)+' KB — siap diunggah';z.classList.add('has-file');}else{l.textContent='Upload laporan harian (.csv)';h.textContent='Pilih file untuk memperbarui data peserta';z.classList.remove('has-file');}this.form.requestSubmit();">
        </label>
    </form>
</div>
