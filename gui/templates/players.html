{% extends "base.html" %}
{% block main_width %}max-w-[1400px]{% endblock %}
{% block content %}

<header class="mb-5">
    <p class="eyebrow mb-1">Roster</p>
    <h1 class="text-2xl sm:text-3xl font-bold mb-1">Daftar Peserta</h1>
    <p class="text-sm text-dim">Semua peserta dari laporan harian. Status WA &amp; Telegram di-update tiap check.</p>
</header>

<div class="mb-4">
    <form hx-get="/players" hx-target="#player-table" hx-swap="innerHTML" hx-trigger="input delay:300ms from:input[name=search], submit">
        <input type="search" name="search" placeholder="Cari nama atau nomor…" value="{{ search }}"
            class="field sm:w-80" autocomplete="off">
    </form>
</div>

<div id="player-table">
    {% include "_players_table.html" %}
</div>

{% endblock %}
