# CodeQL Advanced (default configuration)
#
# This workflow runs GitHub Advanced Security CodeQL on the Python codebase.
# It uses the "advanced" (default) configuration:
#   - `queries: security-extended` adds extra security queries on top of the
#     default query suite (no custom query packs are required).
#   - The analysis can be further customized later, for example by:
#       * adding query packs under `packs:` in the init step,
#       * excluding directories via `paths-ignore` (see
#         .github/codeql/codeql-config.yml, referenced via `config-file`),
#       * building a matrix over multiple languages or Python versions.
# The config file at .github/codeql/codeql-config.yml can be extended to add
# paths-ignore entries, query filters, or custom packs without editing this
# workflow.

name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 1 * * 1"

# Cancel any in-progress CodeQL run for a PR when a newer commit is pushed,
# so only the latest analysis runs. `group` scopes cancellation per branch.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions required: CodeQL only needs to upload SARIF results
# to the security-events endpoint. On a public repository the checkout and
# init steps do not need `actions: read` or `contents: read`, so nothing
# else is granted.
permissions:
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Initializes the CodeQL tools for scanning.
      # The `queries` setting enables the security-extended query suite on
      # top of the default suite — an advanced feature of the default config.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # Autobuild attempts to build any compiled languages; harmless for a
      # pure-Python project and keeps the setup generic.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
